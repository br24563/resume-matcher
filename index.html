<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Matcher</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f5f4f0;
      --surface:      #ffffff;
      --surface-alt:  #f0efe9;
      --border:       rgba(0,0,0,0.10);
      --border-strong:rgba(0,0,0,0.18);
      --text-primary: #0b0b0b;
      --text-secondary:#52514e;
      --text-muted:   #898781;
      --accent:       #2a78d6;
      --accent-bg:    #e6f1fb;
      --accent-text:  #185fa5;
      --success:      #1baf7a;
      --success-bg:   #e1f5ee;
      --success-text: #0f6e56;
      --danger:       #e34948;
      --danger-bg:    #fcebeb;
      --danger-text:  #a32d2d;
      --warn:         #eda100;
      --radius:       8px;
      --font-sans:    system-ui, -apple-system, sans-serif;
      --font-mono:    ui-monospace, 'Cascadia Code', monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:           #111110;
        --surface:      #1a1a19;
        --surface-alt:  #222221;
        --border:       rgba(255,255,255,0.10);
        --border-strong:rgba(255,255,255,0.18);
        --text-primary: #f5f4f0;
        --text-secondary:#c3c2b7;
        --text-muted:   #898781;
        --accent:       #3987e5;
        --accent-bg:    #0c2540;
        --accent-text:  #85b7eb;
        --success:      #199e70;
        --success-bg:   #04201a;
        --success-text: #5dcaa5;
        --danger:       #e66767;
        --danger-bg:    #280f0f;
        --danger-text:  #f09595;
        --warn:         #c98500;
      }
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 24px;
      font-weight: 500;
      color: var(--text-primary);
    }

    header p {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 640px) {
      .input-grid { grid-template-columns: 1fr; }
      .section-grid { grid-template-columns: 1fr !important; }
    }

    .input-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
    }

    .input-card label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-card textarea {
      width: 100%;
      height: 220px;
      resize: vertical;
      background: var(--surface-alt);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 13px;
      font-family: var(--font-mono);
      color: var(--text-primary);
      line-height: 1.6;
      outline: none;
      transition: border-color 0.15s;
    }

    .input-card textarea:focus {
      border-color: var(--accent);
    }

    .input-card textarea::placeholder {
      color: var(--text-muted);
      font-family: var(--font-sans);
    }

    .analyze-btn {
      display: block;
      width: 100%;
      padding: 13px;
      background: var(--text-primary);
      color: var(--bg);
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-bottom: 2rem;
      font-family: var(--font-sans);
    }

    .analyze-btn:hover:not(:disabled) { opacity: 0.82; }
    .analyze-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Score section */
    .score-section {
      display: flex;
      align-items: center;
      gap: 2rem;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 16px;
    }

    .dial-wrap {
      position: relative;
      width: 120px;
      height: 120px;
      flex-shrink: 0;
    }

    .dial-number {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: 500;
      color: var(--text-primary);
      font-family: var(--font-mono);
    }

    .score-meta .score-label {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .score-verdict {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .score-summary {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.65;
    }

    /* Result cards */
    .section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .result-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
    }

    .result-card h3 {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .keyword-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .kw {
      font-size: 12px;
      font-family: var(--font-mono);
      padding: 4px 10px;
      border-radius: 4px;
    }

    .kw.present  { background: var(--success-bg); color: var(--success-text); }
    .kw.missing  { background: var(--accent-bg);  color: var(--accent-text);  }

    .gap-list {
      list-style: none;
    }

    .gap-list li {
      font-size: 13px;
      color: var(--text-secondary);
      padding: 7px 0;
      border-bottom: 0.5px solid var(--border);
      line-height: 1.5;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .gap-list li:last-child { border-bottom: none; }

    .gap-list li i {
      font-size: 15px;
      margin-top: 1px;
      flex-shrink: 0;
    }

    .icon-gap      { color: var(--danger); }
    .icon-strength { color: var(--success); }

    /* Rewrites */
    .rewrite-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 16px;
    }

    .rewrite-card h3 {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .rewrite-item {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 0.5px solid var(--border);
    }

    .rewrite-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .rewrite-section-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .rewrite-direction {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .rewrite-before {
      font-size: 13px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      background: var(--surface-alt);
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 8px;
      line-height: 1.55;
    }

    .rewrite-after {
      font-size: 13px;
      color: var(--success-text);
      font-family: var(--font-mono);
      background: var(--success-bg);
      border-radius: 6px;
      padding: 8px 12px;
      line-height: 1.55;
    }

    /* Utility */
    .hidden   { display: none !important; }

    .error-msg {
      background: var(--danger-bg);
      color: var(--danger-text);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .dot-anim::after {
      content: '.';
      animation: dots 1.2s steps(3, end) infinite;
    }

    @keyframes dots {
      0%   { content: '.'; }
      33%  { content: '..'; }
      66%  { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Resume matcher</h1>
      <p>Paste your resume and a job description to get a match score, keyword gaps, and targeted rewrites.</p>
    </header>

    <div class="input-grid">
      <div class="input-card">
        <label>Your resume</label>
        <textarea id="resume" placeholder="Paste your resume text here..."></textarea>
      </div>
      <div class="input-card">
        <label>Job description</label>
        <textarea id="jobdesc" placeholder="Paste the full job posting here..."></textarea>
      </div>
    </div>

    <div id="error-msg" class="error-msg hidden"></div>

    <button class="analyze-btn" id="analyze-btn" onclick="analyze()">Analyze match</button>

    <div id="loading" class="loading hidden">
      <span class="dot-anim">Analyzing your resume</span>
    </div>

    <!-- Results -->
    <div id="results" class="hidden">

      <div class="score-section">
        <div class="dial-wrap">
          <canvas id="dial" width="120" height="120"></canvas>
          <div class="dial-number" id="dial-number">0%</div>
        </div>
        <div class="score-meta">
          <div class="score-label">Match score</div>
          <div class="score-verdict" id="score-verdict">—</div>
          <div class="score-summary" id="score-summary"></div>
        </div>
      </div>

      <div class="section-grid">
        <div class="result-card">
          <h3>Keywords found</h3>
          <div class="keyword-list" id="kw-present"></div>
        </div>
        <div class="result-card">
          <h3>Keywords to add</h3>
          <div class="keyword-list" id="kw-missing"></div>
        </div>
      </div>

      <div class="section-grid">
        <div class="result-card">
          <h3>Key gaps</h3>
          <ul class="gap-list" id="gap-list"></ul>
        </div>
        <div class="result-card">
          <h3>Strengths to highlight</h3>
          <ul class="gap-list" id="strength-list"></ul>
        </div>
      </div>

      <div class="rewrite-card">
        <h3>Suggested rewrites</h3>
        <div id="rewrites"></div>
      </div>

    </div>
  </div>

  <script>
    function drawDial(pct, color) {
      const canvas = document.getElementById('dial');
      const ctx = canvas.getContext('2d');
      const cx = 60, cy = 60, r = 50, lw = 10;
      const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
      const trackColor = isDark ? '#2c2c2a' : '#e1e0d9';

      ctx.clearRect(0, 0, 120, 120);
      ctx.lineCap = 'round';

      ctx.beginPath();
      ctx.arc(cx, cy, r, Math.PI * 0.75, Math.PI * 2.25);
      ctx.strokeStyle = trackColor;
      ctx.lineWidth = lw;
      ctx.stroke();

      if (pct > 0) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, Math.PI * 0.75, Math.PI * 0.75 + Math.PI * 1.5 * pct);
        ctx.strokeStyle = color;
        ctx.lineWidth = lw;
        ctx.stroke();
      }
    }

    function animateDial(targetPct, color) {
      let current = 0;
      const steps = 45;
      const increment = targetPct / steps;
      const el = document.getElementById('dial-number');
      const interval = setInterval(() => {
        current = Math.min(current + increment, targetPct);
        drawDial(current, color);
        el.textContent = Math.round(current * 100) + '%';
        if (current >= targetPct) clearInterval(interval);
      }, 16);
    }

    function scoreColor(score) {
      if (score >= 0.75) return '#1baf7a';
      if (score >= 0.50) return '#eda100';
      return '#e34948';
    }

    function scoreVerdict(score) {
      if (score >= 0.85) return 'Strong match';
      if (score >= 0.70) return 'Good match';
      if (score >= 0.50) return 'Partial match';
      if (score >= 0.30) return 'Weak match';
      return 'Poor match';
    }

    function show(id)   { document.getElementById(id).classList.remove('hidden'); }
    function hide(id)   { document.getElementById(id).classList.add('hidden'); }
    function setText(id, val) { document.getElementById(id).textContent = val; }

    async function analyze() {
      const resume = document.getElementById('resume').value.trim();
      const jobdesc = document.getElementById('jobdesc').value.trim();
      const errEl = document.getElementById('error-msg');

      hide('error-msg');

      if (!resume || !jobdesc) {
        errEl.textContent = 'Please paste both your resume and the job description.';
        show('error-msg');
        return;
      }

      const btn = document.getElementById('analyze-btn');
      btn.disabled = true;
      hide('results');
      show('loading');

      try {
        const res = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resume, job_description: jobdesc })
        });

        const result = await res.json();

        if (!res.ok || result.error) {
          throw new Error(result.error || 'Unknown error from server.');
        }

        renderResults(result);

      } catch (err) {
        errEl.textContent = err.message || 'Something went wrong. Is the server running?';
        show('error-msg');
      } finally {
        hide('loading');
        btn.disabled = false;
      }
    }

    function renderResults(r) {
      const score = Math.min(100, Math.max(0, r.score || 0));
      const pct = score / 100;
      const color = scoreColor(pct);

      const verdict = document.getElementById('score-verdict');
      verdict.textContent = scoreVerdict(pct);
      verdict.style.color = color;
      setText('score-summary', r.summary || '');

      document.getElementById('kw-present').innerHTML =
        (r.keywords_present || []).map(k => `<span class="kw present">${esc(k)}</span>`).join('');

      document.getElementById('kw-missing').innerHTML =
        (r.keywords_missing || []).map(k => `<span class="kw missing">${esc(k)}</span>`).join('');

      document.getElementById('gap-list').innerHTML =
        (r.gaps || []).map(g =>
          `<li><i class="ti ti-circle-x icon-gap"></i>${esc(g)}</li>`
        ).join('');

      document.getElementById('strength-list').innerHTML =
        (r.strengths || []).map(s =>
          `<li><i class="ti ti-circle-check icon-strength"></i>${esc(s)}</li>`
        ).join('');

      document.getElementById('rewrites').innerHTML =
        (r.rewrites || []).map(rw => `
          <div class="rewrite-item">
            <div class="rewrite-section-label">${esc(rw.section)}</div>
            <div class="rewrite-direction">Before</div>
            <div class="rewrite-before">${esc(rw.before)}</div>
            <div class="rewrite-direction">After</div>
            <div class="rewrite-after">${esc(rw.after)}</div>
          </div>
        `).join('');

      show('results');
      animateDial(pct, color);
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
